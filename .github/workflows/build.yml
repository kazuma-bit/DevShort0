name: Android CI / Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android Project
        run: |
          echo "=== Preparing Android Build Environment ==="

          # 1. Ensure .env and .env.example exist for Secrets Gradle Plugin
          touch .env .env.example

          # 2. Generate debug.keystore required by app's debugConfig signing
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure gradlew is executable
          chmod +x gradlew || true

          echo "=== Setup complete ==="
          ls -la debug.keystore .env

      - name: Run Unit Tests
        run: |
          if ./gradlew :app:tasks --all --no-daemon 2>&1 | grep -q "testDebugUnitTest"; then
            echo "Running :app:testDebugUnitTest..."
            ./gradlew :app:testDebugUnitTest --no-daemon
          elif ./gradlew :app:tasks --all --no-daemon 2>&1 | grep -q "test "; then
            echo "Running :app:test..."
            ./gradlew :app:test --no-daemon || true
          else
            echo "No unit tests to run."
          fi

      - name: Build Release & Debug APKs
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: devtoggle-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          
