name: Android CI / Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup environment and check files
        run: |
          echo "Current working directory:"
          pwd
          echo "Files in checkout:"
          ls -la
          
          # If gradlew does not exist in root, check if it is in a subdirectory
          if [ ! -f gradlew ] && [ -d DevShort ]; then
            echo "Moving contents from DevShort subdirectory to root"
            shopt -s dotglob
            mv DevShort/* . 2>/dev/null || true
          fi
          
          # Ensure gradlew has executable permissions
          chmod +x gradlew 2>/dev/null || true
          
          # Ensure .env exists to satisfy Secrets Gradle Plugin
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: devtoggle-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
