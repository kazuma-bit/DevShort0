name: Android CI / Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate and prepare Gradle project
        run: |
          echo "=== Workspace inspection ==="
          pwd
          ls -la
          
          # If settings.gradle(.kts) is not in the root directory, search for it
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "settings.gradle(.kts) not found in root. Searching subdirectories..."
            SETTINGS_FILE=$(find . -mindepth 2 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
              echo "Found Gradle project in: $PROJECT_DIR"
              echo "Moving files from $PROJECT_DIR to root workspace..."
              shopt -s dotglob
              mv "$PROJECT_DIR"/* . 2>/dev/null || true
            else
              echo "::error::No Gradle build found! Your GitHub repository does not contain 'settings.gradle.kts' or 'build.gradle.kts'."
              echo "Make sure to push all Android project files from Google AI Studio (top-right menu > Push to GitHub)."
              exit 1
            fi
          fi
          
          # Ensure gradlew has executable permissions
          chmod +x gradlew 2>/dev/null || true
          
          # Ensure .env exists to satisfy Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          
          echo "=== Ready to build with files: ==="
          ls -la

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: devtoggle-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
